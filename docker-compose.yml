name: fieldsense

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldsense}
      POSTGRES_DB: ${POSTGRES_DB:-fieldsense}
    ports:
      # Bind to localhost only — do not expose Postgres on public interfaces
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: base
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fieldsense}:${POSTGRES_PASSWORD:-fieldsense}@db:5432/${POSTGRES_DB:-fieldsense}
      SOURCE_ROOT: /data/sample-data
      EVALUATION_AS_OF: ${EVALUATION_AS_OF:-2026-10-16T00:00:00Z}
      DATASET_PROFILE: ${DATASET_PROFILE:-sample}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-fieldsense-dev-change-me}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEMO_USER_PICKER_ENABLED: ${DEMO_USER_PICKER_ENABLED:-true}
      ANSWER_MODE: ${ANSWER_MODE:-llm}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-google}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gemma-4-26b-a4b-it}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${DATASET_HOST_PATH:?Set DATASET_HOST_PATH in .env to your sample-data directory}
        target: /data/sample-data
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped
    command: >
      sh -c "python -m app.ingestion.cli migrate &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

  worker:
    build:
      context: ./backend
      target: base
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fieldsense}:${POSTGRES_PASSWORD:-fieldsense}@db:5432/${POSTGRES_DB:-fieldsense}
      SOURCE_ROOT: /data/sample-data
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - type: bind
        source: ${DATASET_HOST_PATH:?Set DATASET_HOST_PATH in .env to your sample-data directory}
        target: /data/sample-data
        read_only: true
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    # Image HEALTHCHECK hits :8000 (API only). Worker has no HTTP server — probe DB instead.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from sqlalchemy import text; from app.db.session import engine;\nwith engine.connect() as c: c.execute(text('SELECT 1'))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    command: python -m app.jobs.worker

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
